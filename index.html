<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Omaha Payphone Project</title>
    <style>
        :root { 
            --payphone-coral: #FF7F50; 
            --metallic: linear-gradient(145deg, #ffffff 0%, #b0b0b0 50%, #666 100%);
            --recessed-metal: linear-gradient(to bottom, #222 0%, #444 50%, #111 100%);
            --lcd-blue: #00e5ff; 
            --lcd-glow: rgba(0, 229, 255, 0.6); 
        }

        body { background-color: #050505; display: flex; justify-content: center; align-items: center; height: 100dvh; margin: 0; font-family: 'Courier New', Courier, monospace; overflow: hidden; }

        /* Responsive Container */
        .payphone-container { 
            background: var(--payphone-coral); position: relative; padding: 15px; border-radius: 20px; border: 5px solid #d45d30; 
            width: 92vw; max-width: 380px; text-align: center; box-shadow: 0 30px 60px rgba(0,0,0,1);
            transform: scale(min(1, 0.9)); /* Scales down automatically for smaller screens */
        }

        .lcd-display { background: #001a1d; border: 6px solid #222; padding: 8px; height: 110px; margin-bottom: 12px; color: var(--lcd-blue); text-shadow: 0 0 10px var(--lcd-glow); font-size: clamp(1rem, 4vw, 1.25rem); font-weight: 900; overflow: hidden; position: relative; display: flex; flex-direction: column; justify-content: space-around; box-shadow: inset 0 0 30px black; }

        /* Responsive Cradle */
        .cradle-housing {
            background: var(--metallic); padding: 10px; border-radius: 8px; border: 2px solid #555;
            margin: 0 auto 15px; width: 90%; max-width: 320px; box-shadow: 0 5px 15px rgba(0,0,0,0.6);
        }
        .cradle-3d { position: relative; width: 100%; height: clamp(60px, 15dvh, 85px); perspective: 1000px; cursor: pointer; }
        
        /* ... (Cradle Base & Flipper remain the same) ... */

        /* Responsive Controls Layout */
        .controls-layout {
            display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%;
        }
        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        
        button.key { 
            background: var(--metallic); color: #111; border: 1px solid #777; 
            width: clamp(60px, 18vw, 72px); height: clamp(55px, 15vw, 68px); 
            font-size: clamp(1.4rem, 5vw, 1.9rem); border-radius: 6px; font-weight: bold;
        }

        .vol-btn { 
            background: var(--metallic); color: #111; width: clamp(45px, 12vw, 58px); height: clamp(45px, 12vw, 58px); 
            font-size: 0.6rem; border-radius: 6px; box-shadow: 0 3px #333;
        }
    </style>
</head>
<body>
    <!-- Hidden Noise Filter ... -->
    <div class="payphone-container">
        <!-- Content ... -->
    </div>
</body>
</html>
