<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omaha Payphone Project</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --lcd-green: #00ff00;
            --ready-color: #2ecc71;
            --recording-color: #e74c3c;
        }

        body {
            background-color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Courier New', monospace;
        }

        .phone-container {
            width: 320px;
            background: #222;
            padding: 25px;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 2px solid #444;
        }

        .lcd {
            background: #0a0a0a;
            color: var(--lcd-green);
            padding: 20px;
            border-radius: 10px;
            height: 70px;
            margin-bottom: 25px;
            text-align: center;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            line-height: 1.4;
        }

        .lcd-flash { animation: subtle-flash 2s infinite ease-in-out; }
        @keyframes subtle-flash {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .dialpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .dialpad button {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 2px solid #444;
            background: #333;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        /* Specific # Key Glows */
        #key-hash.glow-ready {
            border-color: var(--ready-color);
            box-shadow: 0 0 15px var(--ready-color);
            color: var(--ready-color);
        }

        #key-hash.glow-recording {
            border-color: var(--recording-color);
            box-shadow: 0 0 20px var(--recording-color);
            color: var(--recording-color);
            animation: hash-pulse 1.5s infinite;
        }

        @keyframes hash-pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="phone-container">
        <div id="lcd-screen" class="lcd">Ready...</div>
        
        <div class="dialpad">
            <button onclick="pressKey('1')">1</button>
            <button onclick="pressKey('2')">2</button>
            <button onclick="pressKey('3')">3</button>
            <button onclick="pressKey('4')">4</button>
            <button onclick="pressKey('5')">5</button>
            <button onclick="pressKey('6')">6</button>
            <button onclick="pressKey('7')">7</button>
            <button onclick="pressKey('8')">8</button>
            <button onclick="pressKey('9')">9</button>
            <button onclick="pressKey('*')">*</button>
            <button onclick="pressKey('0')">0</button>
            <button id="key-hash" onclick="pressKey('#')">#</button>
        </div>
        
        <!-- Audio elements for playback -->
        <audio id="archive-player"></audio>
        <audio id="recording-playback"></audio>
    </div>

    <script src="script.js"></script>
</body>
</html>
