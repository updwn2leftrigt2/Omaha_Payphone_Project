<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Omaha Payphone Project</title>
    <style>
        :root { 
            --payphone-coral: #FF7F50; 
            --coral-shadow: #b34a24;
            --metallic-base: linear-gradient(145deg, #ffffff 0%, #d0d0d0 40%, #a0a0a0 60%, #888 100%);
            --lcd-blue: #00e5ff; 
            --lcd-glow: rgba(0, 229, 255, 0.8); 
            --sign-pink: #FF1493;
            --off-white: #fdfaf0;
        }

        * { -webkit-tap-highlight-color: transparent !important; box-sizing: border-box; }
        
        body { 
            background-color: #1a1a1a; display: flex; justify-content: center; 
            align-items: center; height: 100svh; width: 100vw; margin: 0; overflow: hidden;
        }

        .payphone-container { 
            background: var(--payphone-coral); position: relative; padding: 2.5vh; 
            border-radius: 12px; border-top: 4px solid #ff9e7a; border-left: 6px solid #d45d30; 
            border-right: 12px solid var(--coral-shadow); border-bottom: 16px solid #8c381c;
            height: 85vh; aspect-ratio: 310 / 520; text-align: center; 
            box-shadow: 40px 50px 80px rgba(0,0,0,0.9); display: flex; 
            flex-direction: column; justify-content: space-between; z-index: 10;
        }

        .phone-sign {
            background: var(--off-white); padding: 5px; border-radius: 4px;
            box-shadow: 0 0 20px var(--off-white), inset 4px 4px 10px rgba(0,0,0,0.5);
            display: flex; justify-content: center; align-items: center; height: 10%; border: 1px solid rgba(0,0,0,0.3);
        }
        .sign-text { color: var(--sign-pink); font-family: 'Arial Black', Gadget, sans-serif; font-weight: 950; font-size: clamp(0.8rem, 4vw, 1.2rem); letter-spacing: -1.6px; -webkit-text-stroke: 1px var(--lcd-blue); text-shadow: 2px 2px 0px var(--lcd-blue); white-space: nowrap; transform: scaleX(0.92); }

        .lcd-display { 
            background: #001a1d; border: 4px solid #222; padding: 10px; height: 25%; 
            color: var(--lcd-blue); text-shadow: 0 0 10px var(--lcd-glow); 
            /* THE ORIGINAL SERIF FONT */
            font-family: 'Times New Roman', Times, serif; 
            font-size: 12pt; font-weight: 900; 
            overflow: hidden; position: relative; display: flex; 
            flex-direction: column; justify-content: space-around; 
            box-shadow: inset 6px 6px 15px rgba(0,0,0,0.9), inset -2px -2px 5px rgba(255,255,255,0.1), 0 2px 5px rgba(0,0,0,0.5); 
        }

        .cradle-housing { 
            background: #e0e0e0; background-image: var(--metallic-base); position: relative; 
            padding: 8px; border-radius: 8px; width: 95%; align-self: center; cursor: pointer; z-index: 20;
            border-top: 2px solid #fff; border-left: 2px solid #ddd; border-right: 4px solid #444; border-bottom: 6px solid #222;
            box-shadow: 10px 15px 25px rgba(0,0,0,0.7);
        }
        
        .cradle-base { height: 60px; background: linear-gradient(to bottom, #000 0%, #333 50%, #000 100%); clip-path: polygon(0% 0%, 100% 0%, 80% 100%, 20% 100%); display: flex; align-items: center; justify-content: center; position: relative; pointer-events: none; }
        .receiver-text { color: #ddd; font-weight: 950; font-size: 0.8rem; letter-spacing: 1px; font-family: sans-serif; }

        .flipper-container { position: absolute; left: 40%; top: 25px; width: 20%; height: 30px; transform-style: preserve-3d; transition: transform 0.4s ease; transform-origin: top center; z-index: 25; }
        .flipper-face { position: absolute; width: 100%; height: 100%; background: #d0d0d0; background-image: var(--metallic-base); border: 1px solid #222; }
        .flipper-container.up { transform: rotateX(-35deg); }

        .controls-layout { display: grid; grid-template-columns: 1fr 180px 1fr; align-items: center; width: 100%; }
        .keypad { grid-column: 2; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }

        button.key, .vol-btn { 
            background: #dcdcdc; background-image: var(--metallic-base); 
            color: #111; border: 1px solid #666; width: 55px; height: 50px; 
            font-size: 1.4rem; border-radius: 6px; cursor: pointer; 
            box-shadow: 0 4px #222; font-weight: 900; 
        }
        button.key:active, .vol-btn:active { transform: translateY(3px); box-shadow: 0 1px #222; }
        .vol-btn { width: 42px; height: 42px; font-size: 0.5rem; display: flex; align-items: center; justify-content: center; font-family: sans-serif; }

        .recoil { animation: recoil-shake 0.15s linear; }
        @keyframes recoil-shake { 10%, 90% { transform: translate3d(-1px, 2px, 0); } 40%, 60% { transform: translate3d(2px, 1px, 0); } }
    </style>
</head>
<body>
    <div class="payphone-container" id="main-unit">
        <div class="phone-sign"><span class="sign-text">OMAHA PAYPHONE PROJECT</span></div>
        <div class="lcd-display" id="lcd">
            <div id="line1"> </div>
            <div id="line2">LIFT RECEIVER</div>
            <div id="line3">LEVANTE EL RECEPTOR</div>
            <div id="line4"> </div>
        </div>
        <div class="cradle-housing" id="receiver-latch" onclick="toggleHandset()">
            <div class="cradle-base">
                <span class="receiver-text">RECEIVER / RECEPTOR</span>
                <div id="handset-flipper" class="flipper-container">
                    <div class="flipper-face"></div>
                </div>
            </div>
        </div>
        <div class="controls-layout">
            <div></div>
            <div class="keypad">
                <button class="key" onclick="press('1')">1</button><button class="key" onclick="press('2')">2</button><button class="key" onclick="press('3')">3</button>
                <button class="key" onclick="press('4')">4</button><button class="key" onclick="press('5')">5</button><button class="key" onclick="press('6')">6</button>
                <button class="key" onclick="press('7')">7</button><button class="key" onclick="press('8')">8</button><button class="key" onclick="press('9')">9</button>
                <button class="key" onclick="press('*')">*</button><button class="key" onclick="press('0')">0</button><button class="key" onclick="press('#')">#</button>
            </div>
            <div style="padding-left:10px;"><button class="vol-btn" onclick="cycleVolume()">VOL<br>PRESS</button></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
