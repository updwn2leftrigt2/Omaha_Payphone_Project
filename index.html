<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Omaha Payphone Project</title>
    <style>
        :root { 
            --payphone-coral: #FF7F50; 
            --metallic: linear-gradient(135deg, #f0f0f0 0%, #a0a0a0 50%, #f0f0f0 100%);
            --lcd-blue: #00e5ff; 
            --lcd-glow: rgba(0, 229, 255, 0.6); 
        }

        body { 
            background-color: #111; display: flex; justify-content: center; align-items: center; 
            height: 100dvh; margin: 0; font-family: 'Courier New', Courier, monospace; overflow: hidden; 
        }

        /* Ambient Body Pulse */
        .payphone-container { 
            background: var(--payphone-coral);
            background-image: url("https://transparenttextures.com");
            padding: 20px; border-radius: 15px; border: 6px solid #d45d30; 
            width: 90vw; max-width: 360px; text-align: center;
            box-shadow: 0 30px 80px rgba(0,0,0,0.9), inset 0 0 20px rgba(255,255,255,0.1);
            animation: ambient-pulse 8s ease-in-out infinite;
            transform: scale(0.92);
        }
        @keyframes ambient-pulse {
            0%, 100% { filter: brightness(100%); }
            50% { filter: brightness(110%) contrast(105%); }
        }

        /* LCD Display */
        .lcd-display { 
            background: #001a1d; border: 8px solid #222; padding: 10px; height: 115px; 
            margin-bottom: 15px; color: var(--lcd-blue); text-shadow: 0 0 10px var(--lcd-glow); 
            font-size: 1rem; font-weight: bold; overflow: hidden; position: relative;
            display: flex; flex-direction: column; justify-content: space-around;
            box-shadow: inset 0 0 25px black;
        }
        .lcd-display::after { 
            content: ""; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, transparent 40%);
            pointer-events: none; z-index: 4;
        }

        /* ENLARGED METALLIC CRADLE */
        .handset-hook {
            width: 180px; height: 45px; background: var(--metallic);
            background-size: 200% 200%;
            margin: 5px auto 20px; border-radius: 6px; border: 2px solid #555;
            box-shadow: 0 6px #333, 0 12px 15px rgba(0,0,0,0.4);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            color: #111; font-weight: bold; font-size: 0.8rem;
            clip-path: polygon(5% 0%, 95% 0%, 100% 100%, 0% 100%);
            animation: metallic-glimmer 5s linear infinite;
        }
        .handset-hook.off-hook { transform: translateY(4px); box-shadow: 0 2px #333; filter: brightness(1.2); }

        /* Metallic Glimmer Effect */
        @keyframes metallic-glimmer {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        .line-container { width: 100%; overflow: hidden; white-space: nowrap; height: 1.2em; display: flex; justify-content: center; align-items: center; position: relative; }
        .scroll-wrap { display: inline-block; position: absolute; animation: auto-scroll 20s linear infinite; }
        @keyframes auto-scroll { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        .main-controls { display: flex; align-items: center; justify-content: center; gap: 15px; }
        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        
        button.key { 
            background: var(--metallic); background-size: 200% 200%;
            color: #111; border: 1px solid #777; padding: 16px 18px; 
            font-size: 1.6rem; border-radius: 4px; cursor: pointer; 
            box-shadow: 0 4px #555, inset 0 1px 2px white; font-weight: bold;
            animation: metallic-glimmer 6s linear infinite;
            touch-action: manipulation;
        }
        button.key:active { transform: translateY(3px); box-shadow: 0 1px #555; }

        .vol-btn { 
            background: var(--metallic); background-size: 200% 200%;
            color: #111; border: 2px solid #555; width: 75px; height: 75px; 
            border-radius: 50%; font-size: 0.7rem; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px #444, inset 0 2px 4px white;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            animation: metallic-glimmer 4s linear infinite;
            touch-action: manipulation;
        }
    </style>
</head>
<body>
<div class="payphone-container">
    <div class="lcd-display" id="lcd">
        <div id="line1" class="line-container" style="opacity:0.8;">OMAHA PAYPHONE PROJECT</div>
        <div id="line2" class="line-container">LIFT HANDSET / LEVANTE</div>
        <div id="line3" class="line-container">ON HOOK</div>
        <div id="line4" class="line-container">&nbsp;</div>
    </div>

    <!-- Receiver Hook moved below LCD and enlarged -->
    <div id="handset-toggle" class="handset-hook" onclick="toggleHandset()">RECEIVER HOOK</div>
    
    <div class="main-controls">
        <div class="keypad">
            <button class="key" onclick="press('1')">1</button>
            <button class="key" onclick="press('2')">2</button>
            <button class="key" onclick="press('3')">3</button>
            <button class="key" onclick="press('4')">4</button>
            <button class="key" onclick="press('5')">5</button>
            <button class="key" onclick="press('6')">6</button>
            <button class="key" onclick="press('7')">7</button>
            <button class="key" onclick="press('8')">8</button>
            <button class="key" onclick="press('9')">9</button>
            <button class="key" onclick="press('*')">*</button>
            <button class="key" onclick="press('0')">0</button>
            <button class="key" onclick="press('#')">#</button>
        </div>

        <button class="vol-btn" onclick="cycleVolume()">VOLUME<br>PRESS</button>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
