<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Omaha Payphone Project</title>
   <style>
:root {
    --payphone-coral: #FF7F50;
    --coral-shadow: #b34a24;
    --metallic-base: linear-gradient(145deg, #ffffff 0%, #d0d0d0 40%, #a0a0a0 60%, #888 100%);
    --lcd-blue: #00e5ff;
    --lcd-glow: rgba(0, 229, 255, 0.8);
    --sign-pink: #FF1493;
}

/* 1. LOCK SCROLLING & FIX BOUNCE */
html, body {
    height: 100%;
    width: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden; /* Prevents the "bounce" effect */
    position: fixed; /* Extra layer of protection for iOS */
}

body {
    background-color: #1a1a1a;
    background-image: radial-gradient(#333 1px, transparent 1px);
    background-size: 30px 30px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Courier New', Courier, monospace;
}

/* 2. SCALE-TO-FIT CONTAINER */
.booth-frame {
    padding: 10px;
    background: #000;
    border-radius: 20px;
    box-shadow: inset 0 0 40px #000;
    display: flex;
    justify-content: center;
    align-items: center;
    /* This makes sure the phone never exceeds the screen height or width */
    max-height: 98vh; 
    max-width: 98vw;
}

.payphone-container {
    background: var(--payphone-coral);
    position: relative;
    padding: 20px;
    border-radius: 12px;
    border-right: 10px solid var(--coral-shadow);
    border-bottom: 12px solid #8c381c;
    
    /* Using aspect-ratio and height: auto so it scales proportionally */
    width: auto;
    height: 85vh; /* Sets a base height */
    aspect-ratio: 310 / 520;
    
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

/* 3. FIX LCD TEXT SHRINKING */
.lcd-display {
    background: #001a1d;
    border: 4px solid #222;
    padding: 8px;
    flex: 0 0 22%; /* Keeps the LCD height fixed relative to the phone, not the text */
    color: var(--lcd-blue);
    text-shadow: 0 0 10px var(--lcd-glow);
    font-size: 1rem; /* Base size */
    font-weight: 900;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
}

/* Dynamic font sizing based on the phone's height */
@media (max-height: 600px) {
    .lcd-display { font-size: 0.75rem; }
    .keypad { gap: 4px; }
    button.key { width: 45px; height: 40px; font-size: 1.1rem; }
}

.keypad { 
    grid-column: 2; 
    display: grid; 
    grid-template-columns: repeat(3, 1fr); 
    gap: 6px; 
    justify-items: center;
}

button.key {
    width: 50px; /* Specific width helps stop the "jump" on different screens */
    height: 45px;
    font-size: 1.3rem;
    /* ... rest of your button styles ... */
}
</style>

</head>
<body>
    <div class="booth-frame">
        <div class="payphone-container" id="main-unit">
            <div class="phone-sign"><span class="sign-text">OMAHA PAYPHONE PROJECT</span></div>
            
            <div class="lcd-display" id="lcd">
                <div id="line1" style="animation: silver-glow 3s infinite;">OMAHA PAYPHONE PROJECT</div>
                <div id="line2">LIFT RECEIVER</div>
                <div id="line3">LEVANTE EL RECEPTOR</div>
                <div id="line4" class="nav-row">&nbsp;</div>
            </div>

            <div class="cradle-housing" onclick="toggleHandset()">
                <div class="cradle-3d">
                    <div class="cradle-base"><span class="receiver-text">RECEIVER / RECEPTOR</span></div>
                    <div id="handset-flipper" class="flipper-container">
                        <div class="flipper-face flipper-front"></div>
                        <div class="flipper-face flipper-bottom" style="height:20px; transform:rotateX(-90deg) translateZ(25px); background:#666;"></div>
                    </div>
                </div>
            </div>

            <div class="controls-layout">
                <div></div>
                <div class="keypad">
                    <button class="key" onclick="press('1')">1</button>
                    <button class="key" onclick="press('2')">2</button>
                    <button class="key" onclick="press('3')">3</button>
                    <button class="key" onclick="press('4')">4</button>
                    <button class="key" onclick="press('5')">5</button>
                    <button class="key" onclick="press('6')">6</button>
                    <button class="key" onclick="press('7')">7</button>
                    <button class="key" onclick="press('8')">8</button>
                    <button class="key" onclick="press('9')">9</button>
                    <button class="key" onclick="press('*')">*</button>
                    <button class="key" onclick="press('0')">0</button>
                    <button class="key" onclick="press('#')">#</button>
                </div>
                <div class="vol-container">
                    <button class="vol-btn" onclick="cycleVolume()">VOL<br>PRESS</button>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
