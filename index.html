<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omaha Payphone Project</title>
    <style>
        :root { 
            --payphone-coral: #FF7F50; 
            --button-silver: #C0C0C0;
            --lcd-blue: #00e5ff; 
            --lcd-glow: rgba(0, 229, 255, 0.6); 
        }
        body { background-color: #333; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: 'Courier New', Courier, monospace; }
        
        .payphone-container { 
            background: var(--payphone-coral); 
            padding: 30px; 
            border-radius: 15px; 
            border: 5px solid #d45d30; 
            width: 340px; 
            text-align: center;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }
        
        .lcd-display { 
            background: #001a1d; border: 8px solid #222; padding: 10px; height: 135px; 
            margin-bottom: 20px; color: var(--lcd-blue); text-shadow: 0 0 12px var(--lcd-glow); 
            font-size: 1.2rem; font-weight: bold; text-align: left; overflow: hidden;
        }

        .line-container { width: 100%; overflow: hidden; white-space: nowrap; height: 1.5em; position: relative; }
        
        /* STANDARD SCROLL */
        .scroll-wrap { 
            display: inline-block; 
            padding-left: 100%; 
            animation: auto-scroll 12s linear infinite; 
        }

        /* 3X SLOWER SCROLL (36s) */
        .slow-scroll { 
            display: inline-block; 
            padding-left: 100%; 
            animation: auto-scroll 36s linear infinite; 
        }
        
        @keyframes auto-scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-200%); }
        }

        .vol-btn { background: #0047ab; color: white; border: 2px solid #000; padding: 10px; font-size: 0.8rem; margin-bottom: 15px; cursor: pointer; width: 120px; border-radius: 5px; font-weight: bold; }
        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        button.key { 
            background: var(--button-silver); 
            color: #333; border: 2px solid #888; padding: 20px; font-size: 1.7rem; 
            border-radius: 5px; cursor: pointer; box-shadow: 0 4px #666; font-weight: bold;
        }
        button.key:active { transform: translateY(4px); box-shadow: 0 0 #666; }
        .handset-btn { width: 100%; background: #a00; color: white; padding: 18px; margin-bottom: 15px; font-size: 1.2rem; cursor: pointer; border-radius: 5px; box-shadow: 0 4px #600; font-weight: bold; }
        .handset-btn.off-hook { background: #0a0; box-shadow: 0 4px #060; }
    </style>
</head>
<body>
<div class="payphone-container">
    <div class="lcd-display" id="lcd">
        <div id="line1" class="line-container">OMAHA PAYPHONE PROJECT</div>
        <div id="line2" class="line-container">LIFT HANDSET / LEVANTE</div>
        <div id="line3" class="line-container">ON HOOK</div>
        <div id="line4" class="line-container">&nbsp;</div>
    </div>
    <button id="handset-toggle" class="handset-btn" onclick="toggleHandset()">LIFT HANDSET / LEVANTE</button>
    <button class="vol-btn" onclick="cycleVolume()">VOLUME <br> PRESS</button>
    <div class="keypad">
        <button class="key" onclick="press('1')">1</button>
        <button class="key" onclick="press('2')">2</button>
        <button class="key" onclick="press('3')">3</button>
        <button class="key" onclick="press('4')">4</button>
        <button class="key" onclick="press('5')">5</button>
        <button class="key" onclick="press('6')">6</button>
        <button class="key" onclick="press('7')">7</button>
        <button class="key" onclick="press('8')">8</button>
        <button class="key" onclick="press('9')">9</button>
        <button class="key" onclick="press('*')">*</button>
        <button class="key" onclick="press('0')">0</button>
        <button class="key" onclick="press('#')">#</button>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
