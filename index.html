<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Omaha Payphone Project</title>
    <style>
        :root { 
            --payphone-coral: #FF7F50; 
            --coral-shadow: #b34a24;
            --metallic-base: linear-gradient(145deg, #ffffff 0%, #d0d0d0 40%, #a0a0a0 60%, #888 100%);
            --machined-lines: repeating-linear-gradient(transparent, transparent 4px, rgba(0,0,0,0.1) 4px, rgba(0,0,0,0.1) 5px);
            --lcd-blue: #00e5ff; 
            --lcd-glow: rgba(0, 229, 255, 0.8); 
            --sign-pink: #FF1493;
            --off-white: #fdfaf0;
        }

        /* ENSURE CLICKS PASS THROUGH GLOBAL ELEMENTS */
        * { -webkit-tap-highlight-color: transparent !important; }
        
        body { 
            background-color: #1a1a1a; 
            background-image: radial-gradient(#333 1px, transparent 1px);
            background-size: 30px 30px; 
            display: flex; justify-content: center; align-items: center; 
            height: 100svh; width: 100vw; margin: 0; 
            font-family: 'Courier New', Courier, monospace; 
            overflow: hidden;
        }

        .booth-frame { 
            padding: 15px; background: #000; border-radius: 30px; 
            box-shadow: inset 0 0 60px #000; display: flex; justify-content: center; 
            align-items: center; border: 2px solid #222; max-width: 95vw; max-height: 95svh;
            pointer-events: none; /* Mouse clicks pass through to phone */
        }

        .payphone-container { 
            background: var(--payphone-coral); 
            background-image: url("https://transparenttextures.com");
            position: relative; padding: 2.5vh; border-radius: 12px; 
            border-top: 4px solid #ff9e7a; border-left: 6px solid #d45d30; 
            border-right: 12px solid var(--coral-shadow); border-bottom: 16px solid #8c381c;
            height: 82svh; aspect-ratio: 310 / 520; text-align: center; 
            box-shadow: 40px 50px 80px rgba(0,0,0,0.9);
            display: flex; flex-direction: column; justify-content: space-between;
            pointer-events: auto; 
            z-index: 10;
        }

        /* RECESSED BEVELED SIGN */
        .phone-sign {
            background: var(--off-white); padding: 5px; border-radius: 4px;
            box-shadow: 0 0 20px var(--off-white), inset 4px 4px 10px rgba(0,0,0,0.5);
            display: flex; justify-content: center; align-items: center; 
            position: relative; overflow: hidden; height: 10%; border: 1px solid rgba(0,0,0,0.3);
        }
        .sign-text { 
            color: var(--sign-pink); font-family: 'Arial Black', Gadget, sans-serif; 
            font-weight: 950; font-size: clamp(0.8rem, 4vw, 1.2rem); width: 100%; 
            letter-spacing: -1.6px; -webkit-text-stroke: 1px var(--lcd-blue); 
            text-shadow: 2px 2px 0px var(--lcd-blue); white-space: nowrap; 
            transform: scaleX(0.92); 
        }

        .lcd-display { 
            background: #001a1d; border: 8px solid #222; padding: 10px; height: 20%; 
            color: var(--lcd-blue); text-shadow: 0 0 10px var(--lcd-glow); 
            font-size: clamp(0.7rem, 3.5vw, 1.05rem); font-weight: 900; 
            overflow: hidden; position: relative; display: flex; 
            flex-direction: column; justify-content: space-around; 
            box-shadow: inset 0 0 30px black; 
        }

        .nav-row { 
            font-size: 1.05rem; /* MATCHES OTHER LINES */
            font-weight: 900; 
            color: var(--lcd-blue); 
            width: 100%; 
            text-align: center; 
        }

        .cradle-housing { 
            background: #e0e0e0; background-image: var(--metallic-base); position: relative; 
            padding: 8px; border-radius: 8px; border: 2px solid #444; width: 95%; align-self: center; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.6); cursor: pointer; z-index: 20;
        }
        .cradle-3d { position: relative; width: 100%; height: 60px; perspective: 1000px; pointer-events: none; }
        .cradle-base { position: absolute; width: 100%; height: 100%; background: linear-gradient(to bottom, #000 0%, #333 50%, #000 100%); clip-path: polygon(0% 0%, 100% 0%, 80% 100%, 20% 100%); box-shadow: inset 0 20px 40px black; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 5px; }
        .receiver-text { color: #ddd; font-weight: 950; font-size: 0.8rem; letter-spacing: 1px; text-shadow: 0 0 10px rgba(255,255,255,0.4); white-space: nowrap; }

        .flipper-container { position: absolute; left: 40%; top: 25px; width: 20%; height: 30px; transform-style: preserve-3d; transition: transform 0.5s ease; transform-origin: top center; }
        .flipper-face { position: absolute; width: 100%; height: 100%; background: #d0d0d0; background-image: var(--metallic-base); border: 1px solid #222; }
        .flipper-container.up { transform: rotateX(-35deg); }

        .controls-layout { display: grid; grid-template-columns: 1fr 180px 1fr; align-items: center; justify-content: center; width: 100%; margin-bottom: 5px; }
        .keypad { grid-column: 2; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }

        button.key, .vol-btn { 
            background: #dcdcdc; background-image: var(--metallic-base); position: relative; 
            color: #111; border: 1px solid #666; width: 55px; height: 50px; 
            font-size: 1.4rem; border-radius: 6px; cursor: pointer; 
            box-shadow: 0 4px #222, inset 0 1px 2px white; font-weight: 900; 
            transition: transform 0.05s; z-index: 30;
        }
        button.key:active, .vol-btn:active { transform: translateY(3px); box-shadow: 0 1px #222; }

        .vol-container { grid-column: 3; display: flex; justify-content: flex-start; padding-left: 5px; }
        .vol-btn { width: 42px; height: 42px; font-size: 0.5rem; display: flex; flex-direction: column; align-items: center; justify-content: center; }

        .recoil { animation: recoil-shake 0.15s cubic-bezier(.36,.07,.19,.97) both; }
        .micro-recoil { animation: micro-shake 0.08s linear both; }
        @keyframes recoil-shake { 10%, 90% { transform: translate3d(-1px, 2px, 0); } 40%, 60% { transform: translate3d(2px, 1px, 0); } }
        @keyframes micro-shake { 0%, 100% { transform: translate3d(0, 0, 0); } 50% { transform: translate3d(1px, 1px, 0); } }
    </style>
</head>
<body>
    <div class="booth-frame">
        <div class="payphone-container" id="main-unit">
            <div class="phone-sign"><span class="sign-text">OMAHA PAYPHONE PROJECT</span></div>
            <div class="lcd-display" id="lcd">
                <div id="line1" style="animation: silver-glow 3s infinite;">OMAHA PAYPHONE PROJECT</div>
                <div id="line2">LIFT RECEIVER</div>
                <div id="line3">LEVANTE EL RECEPTOR</div>
                <div id="line4" class="nav-row">&nbsp;</div>
            </div>
            <div class="cradle-housing" onclick="toggleHandset()">
                <div class="cradle-3d">
                    <div class="cradle-base"><span class="receiver-text">RECEIVER / RECEPTOR</span></div>
                    <div id="handset-flipper" class="flipper-container">
                        <div class="flipper-face flipper-front"></div>
                        <div class="flipper-face flipper-bottom" style="height:20px; transform:rotateX(-90deg) translateZ(25px); background:#666;"></div>
                    </div>
                </div>
            </div>
            <div class="controls-layout">
                <div></div>
                <div class="keypad">
                    <button class="key" onclick="press('1')">1</button><button class="key" onclick="press('2')">2</button><button class="key" onclick="press('3')">3</button>
                    <button class="key" onclick="press('4')">4</button><button class="key" onclick="press('5')">5</button><button class="key" onclick="press('6')">6</button>
                    <button class="key" onclick="press('7')">7</button><button class="key" onclick="press('8')">8</button><button class="key" onclick="press('9')">9</button>
                    <button class="key" onclick="press('*')">*</button><button class="key" onclick="press('0')">0</button><button class="key" onclick="press('#')">#</button>
                </div>
                <div class="vol-container"><button class="vol-btn" onclick="cycleVolume()">VOL<br>PRESS</button></div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
