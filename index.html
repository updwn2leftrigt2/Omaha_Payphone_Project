<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omaha Payphone Project</title>
    <style>
        :root {
            --lcd-blue: #00e5ff;
            --lcd-glow: rgba(0, 229, 255, 0.4);
            --bg-dark: #1a1a1a;
        }

        body {
            background-color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        .payphone-container {
            background: #222;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            border: 4px solid #444;
            width: 320px;
        }

        /* 20x4 LCD Display */
        .lcd-display {
            background: #001a1d;
            border: 10px solid #111;
            padding: 15px;
            height: 100px;
            margin-bottom: 25px;
            color: var(--lcd-blue);
            text-shadow: 0 0 8px var(--lcd-glow);
            font-size: 1.2rem;
            line-height: 1.2;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        button {
            background: #444;
            color: white;
            border: none;
            padding: 20px;
            font-size: 1.5rem;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px #222;
        }

        button:active {
            box-shadow: 0 0 #222;
            transform: translateY(4px);
        }

        .handset-btn {
            grid-column: span 3;
            background: #a00;
            margin-bottom: 15px;
            font-size: 1rem;
        }
        
        .handset-btn.off-hook { background: #0a0; }
    </style>
</head>
<body>

<div class="payphone-container">
    <div class="lcd-display" id="lcd">
        <div>LIFT HANDSET /</div>
        <div>LEVANTE</div>
        <div id="status">ON HOOK</div>
        <div id="input-display">&nbsp;</div>
    </div>

    <button id="handset-toggle" class="handset-btn" onclick="toggleHandset()">LIFT HANDSET / LEVANTE</button>

    <div class="keypad">
        <button onclick="press('1')">1</button>
        <button onclick="press('2')">2</button>
        <button onclick="press('3')">3</button>
        <button onclick="press('4')">4</button>
        <button onclick="press('5')">5</button>
        <button onclick="press('6')">6</button>
        <button onclick="press('7')">7</button>
        <button onclick="press('8')">8</button>
        <button onclick="press('9')">9</button>
        <button onclick="press('*')">*</button>
        <button onclick="press('0')">0</button>
        <button onclick="press('#')">#</button>
    </div>
</div>

<!-- Remove all the old JS code and just use this one line -->
<script src="script.js"></script>
</body>
</html>
