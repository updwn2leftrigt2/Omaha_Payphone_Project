<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Omaha Payphone Project</title>
    <style>
        :root { 
            --payphone-coral: #FF7F50; 
            --metallic: linear-gradient(145deg, #ffffff 0%, #b0b0b0 50%, #666 100%);
            --recessed-metal: linear-gradient(to bottom, #333 0%, #555 50%, #222 100%);
            --lcd-blue: #00e5ff; 
            --lcd-glow: rgba(0, 229, 255, 0.6); 
        }

        body { background-color: #050505; display: flex; justify-content: center; align-items: center; height: 100dvh; margin: 0; font-family: 'Courier New', Courier, monospace; overflow: hidden; }

        .payphone-container { 
            background: var(--payphone-coral); background-image: url("https://transparenttextures.com");
            padding: 20px; border-radius: 20px; border: 6px solid #d45d30; width: 95vw; max-width: 400px; text-align: center;
            box-shadow: 0 40px 100px rgba(0,0,0,1), inset 0 0 20px rgba(255,255,255,0.2);
            animation: ambient-pulse 10s ease-in-out infinite; transform: scale(0.88);
        }

        .lcd-display { 
            background: #001a1d; border: 8px solid #222; padding: 10px; height: 120px; 
            margin-bottom: 15px; color: var(--lcd-blue); text-shadow: 0 0 10px var(--lcd-glow); 
            font-size: 1.25rem; font-weight: 900; overflow: hidden; position: relative;
            display: flex; flex-direction: column; justify-content: space-around;
            box-shadow: inset 0 0 30px black; border-radius: 4px;
        }

        /* WIDER SILVER PLATE HOUSING */
        .cradle-housing {
            background: var(--metallic); background-size: 200%;
            padding: 15px 10px; border-radius: 8px; border: 2px solid #555;
            margin: 0 auto 25px; width: 320px; /* Widened */
            box-shadow: 0 8px 20px rgba(0,0,0,0.7), inset 0 1px 3px white;
        }

        /* RECESSED METALLIC TRAPEZOID */
        .cradle-3d {
            position: relative; width: 100%; height: 110px; perspective: 1000px; cursor: pointer;
        }
        .cradle-base {
            position: absolute; width: 100%; height: 100%;
            background: var(--recessed-metal);
            clip-path: polygon(0% 0%, 100% 0%, 80% 100%, 20% 100%);
            box-shadow: inset 0 20px 40px rgba(0,0,0,0.8); /* Deep recess effect */
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            padding-top: 12px;
        }
        
        .receiver-text {
            color: #ccc; font-weight: 950; font-size: 1.2rem; letter-spacing: 2px;
            text-shadow: 0 0 12px rgba(255,255,255,0.3);
            animation: silver-glow 3s infinite;
        }

        /* REBUILT SMOOTH FLIPPER */
        .flipper {
            position: absolute; left: 40%; top: 45px; width: 20%; height: 45px;
            background: var(--metallic); background-size: 200%;
            border: 2px solid #222; border-radius: 3px;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: top center; /* Hinge at top */
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            z-index: 10;
        }
        /* Half-flip: 30 degrees */
        .flipper.up { transform: rotateX(-30deg); filter: brightness(1.2); }

        @keyframes silver-glow { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; text-shadow: 0 0 20px white; } }
        @keyframes ambient-pulse { 0%, 100% { filter: brightness(100%); } 50% { filter: brightness(105%); } }

        .line-container { width: 100%; overflow: hidden; white-space: nowrap; height: 1.4em; display: flex; justify-content: center; align-items: center; position: relative; }
        .scroll-wrap { display: inline-block; position: absolute; animation: auto-scroll 22s linear infinite; }
        @keyframes auto-scroll { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        .nav-row { font-size: 1.05rem; font-weight: 900; color: var(--lcd-blue); width: 100%; text-align: center; }

        .controls-layout { display: grid; grid-template-columns: 1fr 240px 1fr; align-items: center; justify-content: center; }
        .keypad { grid-column: 2; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        button.key { background: var(--metallic); background-size: 200%; color: #111; border: 1px solid #777; width: 72px; height: 68px; font-size: 1.9rem; border-radius: 8px; cursor: pointer; box-shadow: 0 5px #333, inset 0 1px 2px white; font-weight: bold; }
        button.key:active { transform: translateY(3px); box-shadow: 0 1px #333; }
        .vol-btn { background: var(--metallic); background-size: 200%; color: #111; border: 1px solid #777; width: 58px; height: 58px; border-radius: 8px; font-size: 0.65rem; font-weight: bold; cursor: pointer; box-shadow: 0 5px #333; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>
<div class="payphone-container">
    <div class="lcd-display" id="lcd">
        <div id="line1" class="line-container" style="animation: silver-glow 3s infinite;">OMAHA PAYPHONE PROJECT</div>
        <div id="line2" class="line-container">LIFT HANDSET / LEVANTE</div>
        <div id="line3" class="line-container">ON HOOK</div>
        <div id="line4" class="nav-row">&nbsp;</div>
    </div>

    <div class="cradle-housing">
        <div class="cradle-3d" onclick="toggleHandset()">
            <div class="cradle-base">
                <span class="receiver-text">RECEIVER / RECEPTOR</span>
            </div>
            <div id="handset-flipper" class="flipper"></div>
        </div>
    </div>
    
    <div class="controls-layout">
        <div></div>
        <div class="keypad">
            <button class="key" onclick="press('1')">1</button>
            <button class="key" onclick="press('2')">2</button>
            <button class="key" onclick="press('3')">3</button>
            <button class="key" onclick="press('4')">4</button>
            <button class="key" onclick="press('5')">5</button>
            <button class="key" onclick="press('6')">6</button>
            <button class="key" onclick="press('7')">7</button>
            <button class="key" onclick="press('8')">8</button>
            <button class="key" onclick="press('9')">9</button>
            <button class="key" onclick="press('*')">*</button>
            <button class="key" onclick="press('0')">0</button>
            <button class="key" onclick="press('#')">#</button>
        </div>
        <div class="vol-container" style="padding-left:10px;">
            <button class="vol-btn" onclick="cycleVolume()">VOL<br>PRESS</button>
        </div>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
