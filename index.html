<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Omaha Payphone Project</title>
<style>
:root {
    --payphone-coral: #FF7F50;
    --coral-shadow: #b34a24;
    --metallic-base: linear-gradient(145deg, #ffffff 0%, #d0d0d0 40%, #a0a0a0 60%, #888 100%);
    --machined-lines: repeating-linear-gradient(transparent, transparent 4px, rgba(0,0,0,0.1) 4px, rgba(0,0,0,0.1) 5px);
    --lcd-blue: #00e5ff;
    --lcd-glow: rgba(0, 229, 255, 0.8);
    --sign-pink: #FF1493;
    --off-white: #fdfaf0;
}

/* LOCK VIEWPORT - Stops the "bounce" and scrolling */
html, body {
    height: 100%;
    width: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    position: fixed; 
    background-color: #1a1a1a;
}

body {
    background-image: radial-gradient(#333 1px, transparent 1px);
    background-size: 30px 30px;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100svh; 
    width: 100vw;
    font-family: 'Courier New', Courier, monospace;
}

* { -webkit-tap-highlight-color: transparent !important; box-sizing: border-box; }

.booth-frame {
    padding: 8px;
    background: #000;
    border-radius: 20px;
    box-shadow: inset 0 0 60px #000;
    display: flex;
    justify-content: center;
    align-items: center;
    border: 2px solid #222;
    width: 98vw;
    height: 98svh;
}

.payphone-container {
    background: var(--payphone-coral);
    position: relative;
    padding: 2vh 15px; /* Added horizontal padding */
    border-radius: 12px;
    border-top: 4px solid #ff9e7a;
    border-left: 6px solid #d45d30;
    border-right: 12px solid var(--coral-shadow);
    border-bottom: 16px solid #8c381c;
    height: 94%; /* Slightly enlarged */
    width: 92vw; /* Widened for more room */
    max-width: 400px; /* Prevents it from getting too wide on desktop */
    text-align: center;
    box-shadow: 40px 50px 80px rgba(0,0,0,0.9);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    z-index: 10;
}

/* SIGN */
.phone-sign {
    background: var(--off-white);
    padding: 5px;
    border-radius: 4px;
    box-shadow: 0 0 20px var(--off-white), inset 4px 4px 10px rgba(0,0,0,0.5);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 10%;
    border: 1px solid rgba(0,0,0,0.3);
}

.sign-text {
    color: var(--sign-pink);
    font-family: 'Arial Black', Gadget, sans-serif;
    font-weight: 950;
    font-size: clamp(0.7rem, 4.5vw, 1.3rem);
    width: 100%;
    letter-spacing: -1.2px;
    -webkit-text-stroke: 1px var(--lcd-blue);
    text-shadow: 2px 2px 0px var(--lcd-blue);
    white-space: nowrap;
}

/* LCD - Fixed height and centered */
.lcd-display {
    background: #001a1d;
    border: 4px solid #222;
    padding: 10px;
    height: 22%;
    color: var(--lcd-blue);
    text-shadow: 0 0 10px var(--lcd-glow);
    font-size: clamp(0.7rem, 3.8vw, 1.1rem);
    font-weight: 900;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    align-items: center;
    box-shadow: inset 6px 6px 15px rgba(0,0,0,0.9);
    margin-bottom: 5px;
}

/* CRADLE */
.cradle-housing {
    background: #e0e0e0;
    background-image: var(--metallic-base);
    position: relative;
    padding: 8px;
    border-radius: 8px;
    width: 100%;
    cursor: pointer;
    z-index: 20;
    border-top: 2px solid #fff;
    border-left: 2px solid #ddd;
    border-right: 4px solid #444;
    border-bottom: 6px solid #222;
}

.cradle-3d { position: relative; width: 100%; height: 55px; perspective: 1000px; }

.cradle-base {
    position: absolute;
    width: 100%; height: 100%;
    background: linear-gradient(to bottom, #000 0%, #333 50%, #000 100%);
    clip-path: polygon(0% 0%, 100% 0%, 85% 100%, 15% 100%);
    display: flex;
    justify-content: center;
    padding-top: 8px;
}

.receiver-text { color: #ddd; font-weight: 950; font-size: 0.75rem; }

.flipper-container {
    position: absolute;
    left: 42%; top: 22px; width: 16%; height: 25px;
    transform-style: preserve-3d;
    transition: transform 0.5s ease;
    transform-origin: top center;
}

.flipper-face { position: absolute; width: 100%; height: 100%; background: #d0d0d0; background-image: var(--metallic-base); border: 1px solid #222; }
.flipper-container.up { transform: rotateX(-35deg); }

/* UPDATED CONTROLS - Grid ensures centering + volume lane */
.controls-layout {
    display: grid;
    grid-template-columns: 50px 1fr 50px; /* Equal side columns keep the center column centered */
    align-items: center;
    width: 100%;
    margin-top: 5px;
}

.keypad-container {
    grid-column: 2;
    display: flex;
    justify-content: center;
}

.keypad { 
    display: grid; 
    grid-template-columns: repeat(3, 1fr); 
    gap: 8px;
}

button.key, .vol-btn {
    background: #dcdcdc;
    background-image: var(--metallic-base);
    color: #111;
    border: 1px solid #666;
    width: clamp(45px, 12vw, 55px); 
    height: clamp(40px, 10vh, 50px);
    font-size: 1.3rem;
    border-radius: 6px;
    cursor: pointer;
    box-shadow: 0 4px #222, inset 0 1px 2px white;
    font-weight: 900;
}

button.key:active, .vol-btn:active { transform: translateY(3px); box-shadow: 0 1px #222; }

/* Volume button sits in the right-hand column */
.vol-container {
    grid-column: 3;
    display: flex;
    justify-content: center;
    padding-top: 10px; /* Push it down slightly to align with the middle row */
}

.vol-btn {
    width: 42px; 
    height: 42px;
    font-size: 0.45rem;
    line-height: 1.1;
    padding: 2px;
}

.nav-row { font-size: 0.95rem; font-weight: 900; color: var(--lcd-blue); width: 100%; text-align: center; }
</style>
</head>
<body>
    <div class="booth-frame">
        <div class="payphone-container" id="main-unit">
            <div class="phone-sign"><span class="sign-text">OMAHA PAYPHONE PROJECT</span></div>
            
            <div class="lcd-display" id="lcd">
                <div id="line1" style="width:100%; text-align:center;">OMAHA PAYPHONE PROJECT</div>
                <div id="line2" style="width:100%; text-align:center;">LIFT RECEIVER</div>
                <div id="line3" style="width:100%; text-align:center;">LEVANTE EL RECEPTOR</div>
                <div id="line4" class="nav-row">&nbsp;</div>
            </div>

            <div class="cradle-housing" onclick="toggleHandset()">
                <div class="cradle-3d">
                    <div class="cradle-base"><span class="receiver-text">RECEIVER / RECEPTOR</span></div>
                    <div id="handset-flipper" class="flipper-container">
                        <div class="flipper-face flipper-front"></div>
                        <div class="flipper-face flipper-bottom" style="height:20px; transform:rotateX(-90deg) translateZ(25px); background:#666;"></div>
                    </div>
                </div>
            </div>

            <div class="controls-layout">
                <!-- Empty div for left spacer -->
                <div style="width: 50px;"></div>
                
                <div class="keypad-container">
                    <div class="keypad">
                        <button class="key" onclick="press('1')">1</button>
                        <button class="key" onclick="press('2')">2</button>
                        <button class="key" onclick="press('3')">3</button>
                        <button class="key" onclick="press('4')">4</button>
                        <button class="key" onclick="press('5')">5</button>
                        <button class="key" onclick="press('6')">6</button>
                        <button class="key" onclick="press('7')">7</button>
                        <button class="key" onclick="press('8')">8</button>
                        <button class="key" onclick="press('9')">9</button>
                        <button class="key" onclick="press('*')">*</button>
                        <button class="key" onclick="press('0')">0</button>
                        <button class="key" onclick="press('#')">#</button>
                    </div>
                </div>
                
                <div class="vol-container">
                    <button class="vol-btn" onclick="cycleVolume()">VOL<br>PRESS</button>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
