<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Omaha Payphone Project</title>
    <style>
        :root { 
            --payphone-coral: #FF7F50; 
            --metallic: linear-gradient(145deg, #ffffff 0%, #b0b0b0 50%, #666 100%);
            --recessed-metal: linear-gradient(to bottom, #222 0%, #444 50%, #111 100%);
            --lcd-blue: #00e5ff; 
            --lcd-glow: rgba(0, 229, 255, 0.6); 
        }

        body { background-color: #050505; display: flex; justify-content: center; align-items: center; height: 100dvh; margin: 0; font-family: 'Courier New', Courier, monospace; overflow: hidden; }

        .payphone-container { 
            background: var(--payphone-coral);
            position: relative; padding: 20px; border-radius: 20px; border: 6px solid #d45d30; 
            width: 95vw; max-width: 400px; text-align: center;
            box-shadow: 0 40px 100px rgba(0,0,0,1), inset 0 0 20px rgba(255,255,255,0.2);
            animation: ambient-pulse 10s ease-in-out infinite; transform: scale(0.88);
            overflow: hidden;
        }

        /* POWDER-COATED TEXTURE OVERLAY */
        .payphone-container::before {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            filter: url(#noiseFilter); opacity: 0.15; pointer-events: none; z-index: 1;
        }

        .lcd-display { 
            background: #001a1d; border: 8px solid #222; padding: 10px; height: 120px; 
            margin-bottom: 15px; color: var(--lcd-blue); text-shadow: 0 0 10px var(--lcd-glow); 
            font-size: 1.25rem; font-weight: 900; overflow: hidden; position: relative; z-index: 2;
            display: flex; flex-direction: column; justify-content: space-around;
            box-shadow: inset 0 0 30px black; border-radius: 4px;
        }

        .cradle-housing {
            background: var(--metallic); padding: 15px 10px; border-radius: 8px; border: 2px solid #555;
            margin: 0 auto 25px; width: 340px; position: relative; z-index: 2;
            box-shadow: 0 8px 20px rgba(0,0,0,0.7), inset 0 1px 3px white;
        }

        .cradle-3d { position: relative; width: 100%; height: 115px; perspective: 1000px; cursor: pointer; }
        .cradle-base {
            position: absolute; width: 100%; height: 100%;
            background: var(--recessed-metal);
            clip-path: polygon(0% 0%, 100% 0%, 80% 100%, 20% 100%);
            box-shadow: inset 0 25px 50px rgba(0,0,0,0.9);
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            padding-top: 12px;
        }
        
        .receiver-text { color: #ddd; font-weight: 950; font-size: 1.25rem; letter-spacing: 2px; text-shadow: 0 0 15px rgba(255,255,255,0.4); animation: silver-glow 3s infinite; }

        .flipper-container {
            position: absolute; left: 40%; top: 50px; width: 20%; height: 45px;
            transform-style: preserve-3d; transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: top center; z-index: 10;
        }
        .flipper-face { position: absolute; width: 100%; height: 100%; background: var(--metallic); border: 1px solid #333; }
        .flipper-front  { transform: translateZ(10px); }
        .flipper-back   { transform: rotateY(180deg) translateZ(10px); background: #666; }
        .flipper-right  { width: 20px; transform: rotateY(90deg) translateZ(30px); left: 50%; margin-left: -10px; background: #888; }
        .flipper-left   { width: 20px; transform: rotateY(-90deg) translateZ(30px); left: 50%; margin-left: -10px; background: #888; }
        .flipper-bottom { height: 20px; transform: rotateX(-90deg) translateZ(35px); background: #777; }
        .flipper-container.up { transform: rotateX(-30deg); }

        .controls-layout { display: grid; grid-template-columns: 1fr 240px 1fr; align-items: center; justify-content: center; position: relative; z-index: 2; }
        .keypad { grid-column: 2; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        button.key { background: var(--metallic); background-size: 200%; color: #111; border: 1px solid #777; width: 72px; height: 68px; font-size: 1.9rem; border-radius: 8px; cursor: pointer; box-shadow: 0 5px #333, inset 0 1px 2px white; font-weight: bold; }
        .vol-btn { background: var(--metallic); background-size: 200%; color: #111; border: 1px solid #777; width: 58px; height: 58px; border-radius: 8px; font-size: 0.65rem; font-weight: bold; cursor: pointer; box-shadow: 0 5px #333; display: flex; flex-direction: column; align-items: center; justify-content: center; }

        @keyframes silver-glow { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; text-shadow: 0 0 20px white; } }
        @keyframes ambient-pulse { 0%, 100% { filter: brightness(100%); } 50% { filter: brightness(105%); } }
        .line-container { width: 100%; overflow: hidden; white-space: nowrap; height: 1.4em; display: flex; justify-content: center; align-items: center; position: relative; }
        .scroll-wrap { display: inline-block; position: absolute; animation: auto-scroll 22s linear infinite; }
        @keyframes auto-scroll { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        .nav-row { font-size: 1.05rem; font-weight: 900; color: var(--lcd-blue); width: 100%; text-align: center; }
    </style>
</head>
<body>
    <!-- Hidden SVG Noise Filter for the texture -->
    <svg style="position: absolute; width: 0; height: 0;">
        <filter id="noiseFilter">
            <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" />
        </filter>
    </svg>

    <div class="payphone-container">
        <div class="lcd-display" id="lcd">
            <div id="line1" class="line-container" style="animation: silver-glow 3s infinite;">OMAHA PAYPHONE PROJECT</div>
            <div id="line2" class="line-container">LIFT HANDSET / LEVANTE</div>
            <div id="line3" class="line-container">ON HOOK</div>
            <div id="line4" class="nav-row">&nbsp;</div>
        </div>

        <div class="cradle-housing">
            <div class="cradle-3d" onclick="toggleHandset()">
                <div class="cradle-base"><span class="receiver-text">RECEIVER / RECEPTOR</span></div>
                <div id="handset-flipper" class="flipper-container">
                    <div class="flipper-face flipper-front"></div>
                    <div class="flipper-face flipper-back"></div>
                    <div class="flipper-face flipper-left"></div>
                    <div class="flipper-face flipper-right"></div>
                    <div class="flipper-face flipper-bottom"></div>
                </div>
            </div>
        </div>
        
        <div class="controls-layout">
            <div></div>
            <div class="keypad">
                <button class="key" onclick="press('1')">1</button><button class="key" onclick="press('2')">2</button><button class="key" onclick="press('3')">3</button>
                <button class="key" onclick="press('4')">4</button><button class="key" onclick="press('5')">5</button><button class="key" onclick="press('6')">6</button>
                <button class="key" onclick="press('7')">7</button><button class="key" onclick="press('8')">8</button><button class="key" onclick="press('9')">9</button>
                <button class="key" onclick="press('*')">*</button><button class="key" onclick="press('0')">0</button><button class="key" onclick="press('#')">#</button>
            </div>
            <div class="vol-container" style="padding-left:10px;"><button class="vol-btn" onclick="cycleVolume()">VOL<br>PRESS</button></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
